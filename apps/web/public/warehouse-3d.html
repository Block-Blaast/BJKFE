<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 창고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/*
 * 3D 창고(W-11) — 바깥 React 화면(/warehouse)이 iframe 으로 띄우고 window.warehouse 로 데이터를 넣는다.
 * 외형은 "블록블라스트 3D 창고" 예시 그대로다(랙·물품 모델·지게차·빛기둥). 예시 데이터 대신 받은 TwinLayout / TwinProjection(오늘 값)으로 칸을 채운다.
 * 정보 카드·버튼은 바깥 React 오버레이가 맡는다.
 */
:root {
  color-scheme: light;
  --sky: #eef5fb;
  --ink: #23384a;
  --muted: #6a8195;
  --line: #d3e2ee;
  --card: rgba(255, 255, 255, 0.86);
  --accent: #4a9fe0;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#fail { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; pointer-events: none; }
#fail.show { display: flex; }
#fail .card { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px 12px 16px; background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 20px rgba(60, 110, 150, 0.12); color: var(--muted); font-size: 15px; font-weight: 500; }
#fail button { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); }
#fail button:hover { background: rgba(238, 245, 251, 0.9); color: var(--ink); }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="3D 창고"></div>
<div id="fail">
  <div class="card" role="alert">
    <span>3D를 불러오지 못했습니다</span>
    <button type="button" id="failClose" aria-label="안내 닫기">&times;</button>
  </div>
</div>

<script>
  // 안전망: 모듈이 끝까지 준비되지 않으면(파일을 못 받음·WebGL 없음 등) 빈 하늘색 대신 안내를 띄운다. 닫으면 다시 띄우지 않는다.
  (function () {
    var closed = false;
    var el = document.getElementById('fail');
    document.getElementById('failClose').addEventListener('click', function () { closed = true; el.className = ''; });
    window.__whFail = function (err) {
      if (err) console.error('[warehouse-3d]', err);
      if (!closed) el.className = 'show';
    };
    setTimeout(function () { if (!window.__whReady) window.__whFail(); }, 10000);
  })();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
let THREE, OrbitControls, RoomEnvironment;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
} catch (err) {
  window.__whFail(err);
  throw err;
}

/* ---------- 데이터 → 물품 모양 ---------- */
// 칸 id 는 `${rack_id}-${level}-${slot}` (바깥 브릿지와 같은 이름).
// 부품을 3D 로 어떻게 보여줄지는 part_id 로 정한다 (부품함·상자·코일·캔·카트리지).
const KIND_RULES = [
  [/bearing|pillow/, 'bin', 'ring', '베어링'],
  [/bolt|capscrew/, 'bin', 'bolt', '볼트'],
  [/nut/, 'bin', 'nut', '너트'],
  [/washer/, 'bin', 'washer', '와셔'],
  [/oring|oilseal/, 'bin', 'oring', '씰'],
  [/belt|timing/, 'coil', 'belt', '벨트'],
  [/hose/, 'coil', 'hose', '에어호스'],
  [/coolant|hydoil|slideway|gearoil|spindleoil/, 'cans', null, '오일'],
  [/grease/, 'tubes', null, '그리스'],
  [/filter/, 'carton', null, '필터'],
  [/endmill|drill|insert|tap/, 'carton', null, '공구'],
];
const itemCache = new Map();
function itemFor(partId) {
  if (itemCache.has(partId)) return itemCache.get(partId);
  const key = String(partId).replace(/^pt-/, '');
  const rule = KIND_RULES.find(([re]) => re.test(key));
  const [, kind, part, label] = rule ?? [null, 'carton', null, '부품'];
  const spec = key.split('-').slice(1).join('-').toUpperCase();
  const it = { id: partId, name: spec ? `${label} ${spec}` : label, kind, part };
  itemCache.set(partId, it);
  return it;
}

// 데이터 좌표(m)를 그대로 쓰면 이 크기의 랙끼리 겹친다. 배율을 곱해 벌린다.
const SCALE_X = 2.6, SCALE_Z = 1.75;

const ui = { loc: null, selAt: 0, hover: null, highlight: new Set(), topView: false };
const data = { layout: null, stock: new Map(), key: null };
const itemsAt = (loc) => data.stock.get(loc) ?? [];

/* 결정적인 난수 (새로고침해도 같은 배치) */
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

/* ---------- 장면 ---------- */
const SKY = 0xeef5fb;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 60, 120);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.08;
controls.minDistance = 2.5;
controls.maxDistance = 95;
controls.autoRotateSpeed = 0.35;
const CENTER = new THREE.Vector3(0, 1.5, 0);
const HOME = { pos: new THREE.Vector3(-21, 19, 27), target: CENTER.clone() };
let topHeight = 58;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
camera.position.set(46, 50, 62);
controls.target.copy(CENTER);

scene.add(new THREE.HemisphereLight(0xffffff, 0xc9d9e6, 0.8));
const key = new THREE.DirectionalLight(0xfffaf2, 1.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
scene.add(key, key.target);

// 데이터로 다시 그리는 것은 모두 이 그룹 아래에 둔다
const world = new THREE.Group();
scene.add(world);

/* ---------- 텍스처 도구 ---------- */
const FONT = '"IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif';
const MONO = '"IBM Plex Mono", Menlo, monospace';
// 캔버스 글씨가 기본 글꼴로 굳지 않게 웹 글꼴을 잠깐 기다린다 (못 받아도 1.5초 뒤 진행)
await Promise.race([
  Promise.all([document.fonts.load(`600 64px ${FONT}`), document.fonts.load(`500 32px ${MONO}`)]).catch(() => {}),
  new Promise((r) => setTimeout(r, 1500)),
]);
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
function noise(g, w, h, n, alpha) { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${rand() < 0.5 ? '0,0,0' : '255,255,255'},${alpha})`; g.fillRect(rand() * w, rand() * h, 2, 2); } }
function barcode(g, x, y, w, h) { let cx = x; g.fillStyle = '#23384a'; while (cx < x + w) { const bw = 1 + Math.floor(rand() * 3); g.fillRect(cx, y, bw, h); cx += bw + 1 + Math.floor(rand() * 3); } }
function textTexture(text, { fg = '#23384a', bg = 'rgba(255,255,255,0.95)', size = 64, pad = 22, weight = '600', radius = 14 } = {}) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  const f = `${weight} ${size}px ${FONT}`; ctx.font = f;
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2, h = Math.ceil(size + pad * 1.4);
  c.width = w; c.height = h; ctx.font = f;
  if (bg) { ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, w, h, radius); ctx.fill(); }
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(text, pad, h / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return { tex, aspect: w / h };
}

/* ---------- 재질 ---------- */
const M = {
  upright: new THREE.MeshStandardMaterial({ color: 0x7fb2dc, roughness: 0.45, metalness: 0.35 }),
  beam: new THREE.MeshStandardMaterial({ color: 0xb8d6ef, roughness: 0.4, metalness: 0.35 }),
  foot: new THREE.MeshStandardMaterial({ color: 0x9aa9b6, roughness: 0.5, metalness: 0.5 }),
  wire: new THREE.MeshStandardMaterial({
    color: 0xc4cfd8, roughness: 0.35, metalness: 0.8, side: THREE.DoubleSide, alphaTest: 0.5,
    alphaMap: canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.fillStyle = '#fff'; for (let i = 0; i < w; i += 16) { g.fillRect(i, 0, 3, h); g.fillRect(0, i, w, 3); } }, [10, 6]),
  }),
  kraft: new THREE.MeshStandardMaterial({ map: canvasTex(256, 256, (g, w, h) => { g.fillStyle = '#d7b88c'; g.fillRect(0, 0, w, h); noise(g, w, h, 3000, 0.05); }), roughness: 0.9 }),
  kraftTop: new THREE.MeshStandardMaterial({ map: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#d7b88c'; g.fillRect(0, 0, w, h); noise(g, w, h, 3000, 0.05);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(w / 2 - 2, 0, 4, h);
    g.fillStyle = 'rgba(232,214,180,0.9)'; g.fillRect(w / 2 - 34, 0, 68, h);
  }), roughness: 0.7 }),
  bin: new THREE.MeshStandardMaterial({ color: 0x8fc4ec, roughness: 0.38, metalness: 0, side: THREE.DoubleSide }),
  hidden: new THREE.MeshBasicMaterial({ visible: false }),
  steel: new THREE.MeshStandardMaterial({ color: 0xc9d2da, roughness: 0.28, metalness: 0.9 }),
  zinc: new THREE.MeshStandardMaterial({ color: 0xb7c1c9, roughness: 0.4, metalness: 0.85 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x3f474e, roughness: 0.85 }),
  hose: new THREE.MeshStandardMaterial({ color: 0x4b555d, roughness: 0.7 }),
  wood: new THREE.MeshStandardMaterial({ color: 0xd8be95, roughness: 0.9 }),
  wrap: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0, transparent: true, opacity: 0.28, depthWrite: false }),
  cart: new THREE.MeshStandardMaterial({ color: 0xf0da92, roughness: 0.45 }),
  cap: new THREE.MeshStandardMaterial({ color: 0xdfe5ea, roughness: 0.4 }),
  can: new THREE.MeshStandardMaterial({ color: 0xd2dbe2, roughness: 0.25, metalness: 0.85 }),
  line: new THREE.MeshBasicMaterial({ color: 0xa6cfee }),
  pillar: new THREE.MeshStandardMaterial({ color: 0xe6edf3, roughness: 0.9 }),
};
/* 라벨 텍스처 (품목명 + 위치값 + 바코드) */
const labelCache = new Map();
function labelTex(title, code, { w = 256, h = 128, bg = '#ffffff', base = null } = {}) {
  const k = `${title}|${code}|${w}|${base}`;
  if (labelCache.has(k)) return labelCache.get(k);
  const t = canvasTex(w, h, (g) => {
    if (base) { g.fillStyle = base; g.fillRect(0, 0, w, h); noise(g, w, h, 1200, 0.05); }
    const pad = base ? w * 0.18 : 0, lw = w - pad * 2, lh = base ? h * 0.5 : h, ly = base ? h * 0.22 : 0;
    g.fillStyle = bg; g.fillRect(pad, ly, lw, lh);
    g.fillStyle = '#23384a'; g.font = `600 ${Math.round(lh * 0.24)}px ${FONT}`; g.textBaseline = 'top';
    g.fillText(title, pad + lw * 0.06, ly + lh * 0.1, lw * 0.88);
    g.fillStyle = '#5c7489'; g.font = `500 ${Math.round(lh * 0.17)}px ${MONO}`;
    g.fillText(code, pad + lw * 0.06, ly + lh * 0.42);
    barcode(g, pad + lw * 0.06, ly + lh * 0.68, lw * 0.6, lh * 0.22);
  });
  labelCache.set(k, t);
  return t;
}
const labelMat = (title, code, opts) => new THREE.MeshStandardMaterial({ map: labelTex(title, code, opts), roughness: 0.75 });

/* ---------- 물품 모델 ---------- */
const G = {
  ring: (() => { const t = new THREE.TorusGeometry(0.045, 0.016, 10, 24); t.rotateX(Math.PI / 2); return t; })(),
  oring: (() => { const t = new THREE.TorusGeometry(0.04, 0.008, 8, 24); t.rotateX(Math.PI / 2); return t; })(),
  washer: (() => { const t = new THREE.TorusGeometry(0.022, 0.008, 6, 18); t.rotateX(Math.PI / 2); return t; })(),
  nut: new THREE.CylinderGeometry(0.022, 0.022, 0.016, 6),
  bolt: (() => { const t = new THREE.CylinderGeometry(0.008, 0.008, 0.11, 8); t.rotateZ(Math.PI / 2); return t; })(),
};
const PART_MAT = { ring: 'steel', oring: 'rubber', washer: 'zinc', nut: 'zinc', bolt: 'zinc' };
// 다시 그릴 때 버리지 않는 공용 모양·재질·텍스처
const SHARED_GEO = new Set(Object.values(G));
const SHARED_MAT = new Set(Object.values(M));

/* ---------- 랙 ---------- */
const SLOT_W = 1.8, LEVEL_H = 1.5, DEPTH = 1.25, BASE = 0.3;
const GLOW = new THREE.Color(0x4a9fe0);
const slotByLoc = new Map();
const hitMeshes = [];
const pickables = [];

function tag(obj, loc) { obj.traverse(o => { if (o.isMesh && !o.userData.part) { o.userData.loc = loc; o.castShadow = true; o.receiveShadow = true; pickables.push(o); } }); return obj; }

function buildBin(it, loc, w, d) {
  const grp = new THREE.Group();
  const n = w > 1.2 ? 2 : 1;
  const bw = Math.min((w - 0.04 * (n - 1)) / n * 0.95, 0.8), bh = 0.32, bd = Math.min(d, 0.95);
  for (let k = 0; k < n; k++) {
    const front = new THREE.MeshStandardMaterial({ map: labelTex(it.name, loc, { w: 256, h: 128, base: '#8fc4ec' }), roughness: 0.38 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), [M.bin, M.bin, M.hidden, M.bin, front, M.bin]);
    body.position.set((k - (n - 1) / 2) * (bw + 0.04), bh / 2, 0);
    grp.add(body);
    /* 테두리 립 (위쪽은 열려 있어 내용물이 보임) */
    for (const [lw, ld, lx, lz] of [[bw + 0.03, 0.03, 0, bd / 2], [bw + 0.03, 0.03, 0, -bd / 2], [0.03, bd, bw / 2, 0], [0.03, bd, -bw / 2, 0]]) {
      const lip = new THREE.Mesh(new THREE.BoxGeometry(lw, 0.025, ld), M.bin); lip.position.set(body.position.x + lx, bh, lz); grp.add(lip);
    }
    /* 내용물: 바닥을 채운 층 + 위에 흩어진 부품 */
    const geo = G[it.part], mat = M[PART_MAT[it.part]];
    const fill = new THREE.Mesh(new THREE.BoxGeometry(bw - 0.04, 0.02, bd - 0.04), mat); fill.position.set(body.position.x, bh - 0.08, 0); grp.add(fill);
    const cnt = 26;
    for (let j = 0; j < cnt; j++) {
      const p = new THREE.Mesh(geo, mat);
      p.userData.part = it.part;
      p.position.set(body.position.x + (rand() - 0.5) * (bw - 0.12), bh - 0.06 + rand() * 0.03, (rand() - 0.5) * (bd - 0.12));
      p.rotation.set((rand() - 0.5) * 0.6, rand() * Math.PI, (rand() - 0.5) * 0.6);
      grp.add(p);
    }
  }
  return grp;
}
function buildCarton(it, loc, w, d, qty) {
  const grp = new THREE.Group();
  const cols = w > 1.2 ? 2 : 1;
  const cw = Math.min((w - 0.06 * (cols - 1)) / cols * 0.94, 0.72), ch = 0.3, cd = Math.min(d * 0.85, 0.7);
  const stack = Math.max(1, Math.min(3, 1 + Math.floor(Math.log10(qty + 1))));
  const front = new THREE.MeshStandardMaterial({ map: labelTex(it.name, loc, { w: 256, h: 128, base: '#d7b88c' }), roughness: 0.9 });
  for (let c = 0; c < cols; c++) for (let j = 0; j < stack - (c && stack > 1 ? 1 : 0); j++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(cw, ch, cd), [M.kraft, M.kraft, M.kraftTop, M.kraft, front, M.kraft]);
    b.position.set((c - (cols - 1) / 2) * (cw + 0.06) + (rand() - 0.5) * 0.04, ch * (j + 0.5), (rand() - 0.5) * 0.04);
    b.rotation.y = (rand() - 0.5) * 0.08;
    grp.add(b);
  }
  return grp;
}
function buildCoil(it, w, qty) {
  const grp = new THREE.Group();
  const isHose = it.part === 'hose';
  const R = Math.min(w * 0.4, isHose ? 0.34 : 0.3), tube = isHose ? 0.045 : 0.018;
  const geo = new THREE.TorusGeometry(R, tube, 12, 48); geo.rotateX(Math.PI / 2);
  const n = Math.max(1, Math.min(isHose ? 4 : 6, qty));
  for (let j = 0; j < n; j++) {
    const c = new THREE.Mesh(geo, isHose ? M.hose : M.rubber);
    c.position.set((rand() - 0.5) * 0.04, tube + j * tube * 2.05, (rand() - 0.5) * 0.04);
    c.rotation.y = rand() * Math.PI;
    grp.add(c);
  }
  return grp;
}
function buildCans(it, loc, w, qty) {
  const grp = new THREE.Group();
  const body = new THREE.CylinderGeometry(0.13, 0.13, 0.26, 28);
  const band = new THREE.MeshStandardMaterial({ map: labelTex(it.name, loc, { w: 256, h: 96 }), roughness: 0.6 });
  const n = Math.max(1, Math.min(4, qty));
  for (let j = 0; j < n; j++) {
    const g = new THREE.Group();
    const c = new THREE.Mesh(body, [band, M.can, M.can]); c.position.y = 0.13; g.add(c);
    const lid = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.008, 6, 28), M.can); lid.rotation.x = Math.PI / 2; lid.position.y = 0.262; g.add(lid);
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.005, 6, 24, Math.PI), M.foot); handle.position.y = 0.262; handle.rotation.y = rand() * Math.PI; g.add(handle);
    g.position.set(((j % 2) - 0.5) * 0.3, 0, (Math.floor(j / 2) - 0.5) * 0.3);
    g.rotation.y = -0.4 + rand() * 0.3;
    grp.add(g);
  }
  return grp;
}
function buildTubes(qty) {
  const grp = new THREE.Group();
  const tray = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.06, 0.42), M.kraft); tray.position.y = 0.03; grp.add(tray);
  const body = new THREE.CylinderGeometry(0.048, 0.048, 0.3, 18);
  const capG = new THREE.CylinderGeometry(0.03, 0.045, 0.04, 18);
  const n = Math.max(1, Math.min(10, qty));
  for (let j = 0; j < n; j++) {
    const x = ((j % 5) - 2) * 0.11, z = (Math.floor(j / 5) - 0.5) * 0.12;
    const t = new THREE.Mesh(body, M.cart); t.position.set(x, 0.21, z); grp.add(t);
    const c = new THREE.Mesh(capG, M.cap); c.position.set(x, 0.38, z); grp.add(c);
  }
  return grp;
}
function buildPallet(it, loc, w, d) {
  const grp = new THREE.Group();
  const pw = Math.min(w * 0.92, 1.1), pd = Math.min(d, 0.95);
  for (let k = 0; k < 5; k++) { const sl = new THREE.Mesh(new THREE.BoxGeometry(pw, 0.025, pd / 5 - 0.03), M.wood); sl.position.set(0, 0.11, (k - 2) * (pd / 5)); grp.add(sl); }
  for (const x of [-pw / 2 + 0.06, 0, pw / 2 - 0.06]) { const bl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, pd), M.wood); bl.position.set(x, 0.05, 0); grp.add(bl); }
  const front = new THREE.MeshStandardMaterial({ map: labelTex(it.name, loc, { w: 256, h: 128, base: '#d7b88c' }), roughness: 0.9 });
  const ch = 0.7;
  const box = new THREE.Mesh(new THREE.BoxGeometry(pw * 0.92, ch, pd * 0.9), [M.kraft, M.kraft, M.kraftTop, M.kraft, front, M.kraft]);
  box.position.y = 0.125 + ch / 2; grp.add(box);
  const wrap = new THREE.Mesh(new THREE.BoxGeometry(pw * 0.95, ch * 0.8, pd * 0.93), M.wrap); wrap.position.y = 0.125 + ch * 0.42; grp.add(wrap);
  return grp;
}
function buildItem(it, loc, w, d, qty) {
  switch (it.kind) {
    case 'bin': return buildBin(it, loc, w, d);
    case 'coil': return buildCoil(it, w, qty);
    case 'cans': return buildCans(it, loc, w, qty);
    case 'tubes': return buildTubes(qty);
    default: return buildCarton(it, loc, w, d, qty);
  }
}

/* ---------- 지게차 ---------- */
function forklift() {
  const f = new THREE.Group();
  const body = new THREE.MeshStandardMaterial({ color: 0xf2dc9c, roughness: 0.45, metalness: 0.1 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x7d8f9e, roughness: 0.6 });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; f.add(m); return m; };
  add(new THREE.BoxGeometry(1.3, 0.7, 2.0), body, 0, 0.65, 0);
  add(new THREE.BoxGeometry(1.3, 0.5, 0.5), dark, 0, 0.75, -0.95);
  add(new THREE.BoxGeometry(0.7, 0.4, 0.6), dark, 0, 1.2, -0.2);
  for (const x of [-0.6, 0.6]) for (const z of [-0.6, 0.6]) add(new THREE.BoxGeometry(0.06, 1.3, 0.06), dark, x, 1.65, z - 0.1);
  add(new THREE.BoxGeometry(1.3, 0.06, 1.3), dark, 0, 2.3, -0.1);
  for (const x of [-0.45, 0.45]) add(new THREE.BoxGeometry(0.1, 2.8, 0.1), M.steel, x, 1.45, 1.1);
  const wheel = new THREE.CylinderGeometry(0.32, 0.32, 0.25, 24); wheel.rotateZ(Math.PI / 2);
  for (const x of [-0.68, 0.68]) for (const z of [-0.6, 0.65]) add(wheel, M.rubber, x, 0.32, z);
  /* 안쪽 마스트는 포크가 오른 높이의 절반만큼 따라 올라간다 (높은 단에서도 포크가 허공에 뜨지 않게) */
  const inner = new THREE.Group(); f.add(inner);
  for (const x of [-0.33, 0.33]) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.6, 0.08), M.steel); m.position.set(x, 1.45, 1.17); m.castShadow = true; inner.add(m); }
  /* 포크·등받이·화물은 한 묶음으로 오르내린다 */
  const carriage = new THREE.Group(); f.add(carriage);
  for (const x of [-0.3, 0.3]) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 1.2), M.steel); m.position.set(x, 0.32, 1.75); m.castShadow = true; carriage.add(m); }
  const rest = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.05), M.steel); rest.position.set(0, 0.68, 1.2); rest.castShadow = true; carriage.add(rest);
  const pal = buildPallet({ name: '입고 화물' }, 'IN-01', 1.2, 1.1); pal.position.set(0, 0.3, 1.75); carriage.add(pal);
  pal.traverse(o => { if (o.isMesh) o.castShadow = true; });
  f.userData = { inner, carriage, pal, palShow: 1 };
  return f;
}
let lift = null, liftDir = 1, liftMin = 0, liftMax = 0, liftLane = 0, rackRows = [];

/* ---------- 받은 데이터로 창고 세우기 ---------- */
function clearWorld() {
  // 지게차는 다시 세우지 않고 옮겨 싣는다. 입출고 직후 재고가 바뀌어 창고를 다시 세워도 하던 동작을 이어 간다
  if (lift) world.remove(lift);
  world.traverse((o) => {
    if (!o.isMesh) return;
    if (o.geometry && !SHARED_GEO.has(o.geometry)) o.geometry.dispose();
    for (const m of [].concat(o.material)) if (m && !SHARED_MAT.has(m)) m.dispose();
  });
  world.clear();
  slotByLoc.clear();
  hitMeshes.length = 0;
  pickables.length = 0;
}

// 단이 하나뿐인 곳(바닥 보관, 예: E구역 유류)은 선반 없이 바닥에 칠한 칸 + 팔레트로 그린다
function buildFloorBay(s, g, add) {
  const W = s.slots * SLOT_W, PH = 0.14;
  const bay = (w, d, x, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), M.line); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.014, z); g.add(m); };
  bay(W + 0.1, 0.1, 0, -DEPTH / 2 - 0.15); bay(W + 0.1, 0.1, 0, DEPTH / 2 + 0.15);
  for (let i = 0; i <= s.slots; i++) bay(0.1, DEPTH + 0.4, -W / 2 + i * SLOT_W, 0);
  /* 간판: 뒤쪽 기둥 두 개에 건다 */
  const { tex, aspect } = textTexture(s.label, { fg: '#3a86c4', size: 96, pad: 30, radius: 18 });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.9 * aspect, 0.9), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  sign.position.set(0, 2.4, -DEPTH / 2 - 0.35); g.add(sign);
  const back = sign.clone(); back.rotation.y = Math.PI; back.position.z -= 0.01; g.add(back);
  for (const sx of [-0.42 * aspect, 0.42 * aspect]) add(new THREE.BoxGeometry(0.06, 2.9, 0.06), M.upright, sx, 1.45, -DEPTH / 2 - 0.36);
  for (let i = 1; i <= s.slots; i++) {
    const loc = `${s.id}-1-${i}`;
    const lx = -W / 2 + SLOT_W * (i - 0.5);
    /* 팔레트 */
    const pw = SLOT_W * 0.86, pd = DEPTH * 0.9;
    for (let k = 0; k < 5; k++) add(new THREE.BoxGeometry(pw, 0.025, pd / 5 - 0.03), M.wood, lx, PH - 0.0125, (k - 2) * (pd / 5));
    for (const x of [-pw / 2 + 0.06, 0, pw / 2 - 0.06]) add(new THREE.BoxGeometry(0.1, PH - 0.025, pd), M.wood, lx + x, (PH - 0.025) / 2, 0);
    const mat = new THREE.MeshBasicMaterial({ color: GLOW, transparent: true, opacity: 0, depthWrite: false });
    const hit = new THREE.Mesh(new THREE.BoxGeometry(SLOT_W * 0.96, LEVEL_H * 0.86, DEPTH * 1.02), mat);
    hit.position.set(lx, PH + LEVEL_H * 0.43, 0); hit.userData.loc = loc; g.add(hit); hitMeshes.push(hit);
    /* 바닥 위치 라벨 */
    const lbl = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.115), labelMat(loc, '', { w: 256, h: 64 }));
    lbl.rotation.x = -Math.PI / 2; lbl.position.set(lx, 0.016, DEPTH / 2 + 0.32); g.add(lbl);
    slotByLoc.set(loc, { group: g, hit, mat, local: new THREE.Vector3(lx, PH, 0), beam: null, floor: true });
  }
}

function buildWorld(layout) {
  clearWorld();
  seed = 7;
  const racks = layout.racks.map((r) => ({ ...r, x: r.x * SCALE_X, z: r.z * SCALE_Z }));
  if (!racks.length) return;

  /* 바닥 — 랙이 차지한 범위에 여백을 둔다 */
  const halfW = (r) => (r.slots * SLOT_W) / 2;
  const rx0 = Math.min(...racks.map((r) => r.x - halfW(r))), rx1 = Math.max(...racks.map((r) => r.x + halfW(r)));
  const rz0 = Math.min(...racks.map((r) => r.z)), rz1 = Math.max(...racks.map((r) => r.z));
  const FLOOR = { x0: rx0 - 6, x1: rx1 + 6, z0: rz0 - 8, z1: rz1 + 11 };
  const floorTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#e8eff5'; g.fillRect(0, 0, w, h);
    noise(g, w, h, 6000, 0.025);
    g.strokeStyle = '#dbe6ef'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
  }, [(FLOOR.x1 - FLOOR.x0) / 4, (FLOOR.z1 - FLOOR.z0) / 4]);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR.x1 - FLOOR.x0, FLOOR.z1 - FLOOR.z0), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85, metalness: 0 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set((FLOOR.x0 + FLOOR.x1) / 2, 0, (FLOOR.z0 + FLOOR.z1) / 2);
  floor.receiveShadow = true;
  world.add(floor);
  const strip = (x0, x1, z, w = 0.12) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, w), M.line); m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, 0.012, z); world.add(m); };
  const stripZ = (x, z0, z1, w = 0.12) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, z1 - z0), M.line); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, (z0 + z1) / 2); world.add(m); };
  for (const z of [...new Set(racks.map((r) => r.z))]) { strip(FLOOR.x0 + 1, FLOOR.x1 - 1, z - 1.4); strip(FLOOR.x0 + 1, FLOOR.x1 - 1, z + 1.4); }
  /* 바닥 구역 — 보관 구역만, 크게 */
  for (const z of layout.zones.filter((q) => q.kind === 'storage')) {
    const x0 = (z.x - z.width / 2) * SCALE_X, x1 = (z.x + z.width / 2) * SCALE_X;
    stripZ(Math.max(x0, FLOOR.x0 + 1), FLOOR.z0 + 2, FLOOR.z1 - 2);
    stripZ(Math.min(x1, FLOOR.x1 - 1), FLOOR.z0 + 2, FLOOR.z1 - 2);
    const { tex, aspect } = textTexture(z.label, { bg: null, fg: 'rgba(120,175,220,0.7)', size: 120 });
    const th = Math.min(2.0, ((x1 - x0) * 0.9) / aspect); // 구역 폭을 넘지 않게
    const m = new THREE.Mesh(new THREE.PlaneGeometry(th * aspect, th), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(z.x * SCALE_X, 0.02, rz1 + 5.6); world.add(m);
  }
  for (const [x, z] of [[FLOOR.x0 + 2, FLOOR.z0 + 2], [(FLOOR.x0 + FLOOR.x1) / 2, FLOOR.z0 + 2], [FLOOR.x1 - 2, FLOOR.z0 + 2]]) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, 11, 0.8), M.pillar);
    p.position.set(x, 5.5, z); p.castShadow = true; p.receiveShadow = true; world.add(p);
  }

  /* 랙 */
  for (const s of racks) {
    const g = new THREE.Group(); g.position.set(s.x, 0, s.z); g.rotation.y = s.rotation || 0; world.add(g);
    const add = (geo, mat, x, y, z, shadow = true) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (shadow) { m.castShadow = true; m.receiveShadow = true; } g.add(m); return m; };
    if (s.levels === 1) { buildFloorBay(s, g, add); continue; }
    const W = s.slots * SLOT_W, H = BASE + s.levels * LEVEL_H;
    const upGeo = new THREE.BoxGeometry(0.1, H + 0.25, 0.08);
    for (const x of [-W / 2, 0, W / 2]) {
      for (const z of [-DEPTH / 2, DEPTH / 2]) {
        add(upGeo, M.upright, x, (H + 0.25) / 2, z);
        add(new THREE.BoxGeometry(0.2, 0.02, 0.18), M.foot, x, 0.01, z);
      }
      for (let k = 0; k < Math.floor(H / 1.1); k++) { const br = add(new THREE.BoxGeometry(0.04, 1.45, 0.04), M.upright, x, 0.6 + k * 1.1, 0, false); br.rotation.x = (k % 2 ? 1 : -1) * 0.95; }
      add(new THREE.BoxGeometry(0.04, 0.04, DEPTH), M.upright, x, 0.15, 0, false);
    }
    for (let l = 0; l <= s.levels; l++) {
      const y = l === s.levels ? H : BASE + l * LEVEL_H;
      for (const z of [-DEPTH / 2, DEPTH / 2]) add(new THREE.BoxGeometry(W, 0.13, 0.06), M.beam, 0, y - 0.04, z + Math.sign(z) * 0.04);
      if (l < s.levels) {
        const deck = add(new THREE.PlaneGeometry(W - 0.06, DEPTH), M.wire, 0, y + 0.03, 0);
        deck.rotation.x = -Math.PI / 2;
        for (let b = 0; b < s.slots * 2; b++) add(new THREE.BoxGeometry(0.03, 0.04, DEPTH), M.foot, -W / 2 + (b + 0.5) * (W / (s.slots * 2)), y + 0.005, 0, false);
      }
    }
    const { tex, aspect } = textTexture(s.label, { fg: '#3a86c4', size: 96, pad: 30, radius: 18 });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.9 * aspect, 0.9), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    sign.position.set(0, H + 0.95, DEPTH / 2 + 0.06); g.add(sign);
    const back = sign.clone(); back.rotation.y = Math.PI; back.position.z = -DEPTH / 2 - 0.06; g.add(back);
    for (const sx of [-0.32 * aspect, 0.32 * aspect]) add(new THREE.BoxGeometry(0.025, 0.5, 0.025), M.foot, sx, H + 0.3, DEPTH / 2 + 0.06, false);

    for (let l = 1; l <= s.levels; l++) for (let i = 1; i <= s.slots; i++) {
      const loc = `${s.id}-${l}-${i}`;
      const lx = -W / 2 + SLOT_W * (i - 0.5);
      const base = BASE + (l - 1) * LEVEL_H + 0.045;
      const mat = new THREE.MeshBasicMaterial({ color: GLOW, transparent: true, opacity: 0, depthWrite: false });
      const hit = new THREE.Mesh(new THREE.BoxGeometry(SLOT_W * 0.96, LEVEL_H * 0.86, DEPTH * 1.02), mat);
      hit.position.set(lx, base + LEVEL_H * 0.43, 0); hit.userData.loc = loc; g.add(hit); hitMeshes.push(hit);
      /* 빔 위치 라벨 */
      const lbl = new THREE.Mesh(new THREE.PlaneGeometry(0.46, 0.115), labelMat(loc, '', { w: 256, h: 64 }));
      lbl.position.set(lx, base - 0.085, DEPTH / 2 + 0.072); g.add(lbl);
      slotByLoc.set(loc, { group: g, hit, mat, local: new THREE.Vector3(lx, base, 0), beam: null });
    }
  }

  /* 물품 */
  for (const [loc, slot] of slotByLoc) {
    const its = itemsAt(loc).slice(0, 2);
    if (!its.length) continue;
    const inner = SLOT_W * 0.9, colW = inner / its.length;
    its.forEach((s, k) => {
      // 바닥 보관 칸은 통·상자가 커 보이게 1.5배로 키운다 (칸 폭 안에 들어가게 줄여서 만든 뒤 키운다)
      const k2 = slot.floor ? 1.5 : 1;
      const obj = buildItem(itemFor(s.partId), loc, colW / k2, (DEPTH * 0.85) / k2, s.qty);
      obj.scale.setScalar(k2);
      const p = slot.local.clone();
      p.x += -inner / 2 + colW * (k + 0.5);
      obj.position.copy(p);
      slot.group.add(obj);
      tag(obj, loc);
    });
  }

  /* 작은 부품은 InstancedMesh 하나로 합쳐서 그리기 (성능) */
  world.updateMatrixWorld(true);
  const groups = {};
  world.traverse(o => { if (o.isMesh && o.userData.part) (groups[o.userData.part] ||= []).push(o); });
  for (const [part, list] of Object.entries(groups)) {
    const inst = new THREE.InstancedMesh(G[part], M[PART_MAT[part]], list.length);
    list.forEach((o, i) => { inst.setMatrixAt(i, o.matrixWorld); o.parent.remove(o); });
    inst.instanceMatrix.needsUpdate = true;
    inst.receiveShadow = true;
    world.add(inst);
  }

  /* 지게차 — 앞 두 줄 사이 통로를 오간다 */
  const rows = [...new Set(racks.map((r) => r.z))].sort((a, b) => a - b);
  rackRows = rows;
  liftLane = rows.length > 1 ? (rows[0] + rows[1]) / 2 : rows[0] + 3.5;
  liftMin = FLOOR.x0 + 3; liftMax = FLOOR.x1 - 3;
  if (!lift) { lift = forklift(); lift.position.set(liftMin, 0, liftLane); }
  world.add(lift);

  /* 반사 강도를 낮춰 파스텔 톤 유지 */
  world.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => { if (m.isMeshStandardMaterial) m.envMapIntensity = m.metalness > 0.5 ? 0.9 : 0.35; }); });

  /* 카메라·그림자 범위를 창고 크기에 맞춘다 */
  CENTER.set((rx0 + rx1) / 2, 1.5, (rz0 + rz1) / 2);
  const span = Math.max(rx1 - rx0, (rz1 - rz0) * 1.6);
  const k = Math.min(1.2, Math.max(0.6, span / 40));
  HOME.pos.copy(CENTER).add(new THREE.Vector3(-21, 17.5, 27.5).multiplyScalar(k));
  HOME.target.copy(CENTER);
  topHeight = 58 * k;
  const hx = (FLOOR.x1 - FLOOR.x0) / 2 + 4, hz = (FLOOR.z1 - FLOOR.z0) / 2 + 4;
  key.position.copy(CENTER).add(new THREE.Vector3(-18, 34, 22));
  key.target.position.copy(CENTER);
  Object.assign(key.shadow.camera, { left: -hx, right: hx, top: hz, bottom: -hz, near: 1, far: 120 });
  key.shadow.camera.updateProjectionMatrix();
}

// 오늘 재고(qty[0])만 쓴다. 0 이하면 빈 칸이다
function indexStock(layout, projection) {
  const qtyOf = new Map((projection?.bins ?? []).map((b) => [b.part_id, Array.isArray(b.qty) ? b.qty[0] ?? 0 : 0]));
  const stock = new Map();
  for (const p of layout.placements) {
    const qty = Math.max(0, Math.round(qtyOf.get(p.part_id) ?? 0));
    if (!qty) continue;
    const loc = `${p.rack_id}-${p.level}-${p.slot}`;
    const list = stock.get(loc) ?? [];
    list.push({ partId: p.part_id, qty });
    stock.set(loc, list);
  }
  return stock;
}

/* ---------- 강조 빛기둥 ---------- */
const beamGeo = new THREE.CylinderGeometry(0.55, 0.85, 1, 32, 1, true); beamGeo.translate(0, 0.5, 0);
SHARED_GEO.add(beamGeo);
function beamFor(loc) {
  const s = slotByLoc.get(loc);
  if (s.beam) return s.beam;
  const m = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({ color: GLOW, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  const p = s.local.clone(); s.group.localToWorld(p);
  m.position.copy(p); m.scale.set(1, 12 - p.y, 1); m.visible = false; world.add(m);
  s.beam = m; return m;
}

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---------- 카메라 ---------- */
let fly = null, idleHome = true, introDone = false;
function flyTo(pos, target, dur = 950) {
  controls.autoRotate = false;
  if (reduced) { camera.position.copy(pos); controls.target.copy(target); return; }
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), start: performance.now(), dur };
}
function goHome(dur = 1100) { idleHome = true; ui.topView = false; flyTo(HOME.pos, HOME.target, dur); }
function goTop() { idleHome = false; ui.topView = true; flyTo(new THREE.Vector3(CENTER.x, topHeight, CENTER.z + 0.01), new THREE.Vector3(CENTER.x, 0, CENTER.z)); }
const slotWorld = loc => { const s = slotByLoc.get(loc); if (!s) return null; const p = s.local.clone(); p.y += LEVEL_H * 0.35; return s.group.localToWorld(p); };
function flyToSlot(loc) { const t = slotWorld(loc); if (!t) return; idleHome = false; ui.topView = false; flyTo(t.clone().add(new THREE.Vector3(0.7, 0.8, 3.6)), t); }
function flyToLocs(locs) {
  const pts = locs.map(slotWorld).filter(Boolean);
  if (!pts.length) return;
  idleHome = false; ui.topView = false;
  const c = pts.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / pts.length);
  const span = Math.max(...pts.map(p => p.distanceTo(c)));
  flyTo(c.clone().add(new THREE.Vector3(-2, 7 + span * 0.7, 10 + span * 1.1)), c);
}

const post = (type, payload = {}) => {
  try { window.parent.postMessage({ source: 'warehouse-3d', type, ...payload }, location.origin); } catch (err) { console.warn('[warehouse-3d] postMessage 실패', err); }
};

/* ---------- 입력 ---------- */
// 선택 상태는 바깥이 정한다. 누르면 알리기만 하고, 바깥이 select()·flyTo() 로 되돌려 준다.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const item = ray.intersectObjects(pickables, false).find(h => h.object.visible !== false && h.object.material !== M.hidden);
  if (item) return item.object.userData.loc;
  const hit = ray.intersectObjects(hitMeshes, false)[0];
  return hit ? hit.object.userData.loc : null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; fly = null; controls.autoRotate = false; idleHome = false; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 6 || !data.layout) return;
  const loc = pick(e);
  post('select', { loc, partId: loc ? itemsAt(loc)[0]?.partId ?? null : null });
});
renderer.domElement.addEventListener('pointermove', e => {
  if (down || !data.layout) return;
  const loc = pick(e);
  renderer.domElement.style.cursor = loc ? 'pointer' : 'grab';
  if (loc !== ui.hover) { ui.hover = loc; post('hover', { loc }); }
});
renderer.domElement.addEventListener('pointerleave', () => { if (ui.hover) { ui.hover = null; post('hover', { loc: null }); } });

/* ---------- 입출고 동작 ---------- */
// 재고가 들어오면(in) 지게차가 그 칸 앞으로 가서 포크를 단 높이까지 올리고 화물을 밀어 넣는다.
// 나가면(out) 빈 포크로 들어가 화물을 떠서 빼 온다. 일이 끝나면 통로로 돌아가 다시 순찰한다.
// 바깥이 moveStock 으로 부른다. 여러 건이 오면 차례대로 한다.
const DRIVE = 3.4, CREEP = 0.9, TURN = 3.2, LIFT_SPEED = 1.6;
const FORK_REACH = 1.75; // 지게차 원점 → 포크 위 화물 가운데 (forklift() 의 화물 z)
const APPROACH = 1.4;    // 칸 앞에서 방향을 잡고 포크를 올리는 자리까지의 여유
const PALLET_Y = 0.3;    // 포크를 내렸을 때 화물 바닥 높이
const MAX_QUEUE = 5;
const missions = [];
let job = null; // { loc, steps, i } — loc 가 null 이면 통로로 돌아가는 중
let workingLoc = null;

const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));
// 두 z 사이에 랙 줄이 있으면 통로를 건너갈 수 없다 → 창고 끝 통로로 돌아간다
const blocked = (z1, z2) => rackRows.some((z) => z > Math.min(z1, z2) + 0.01 && z < Math.max(z1, z2) - 0.01);
function route(from, to) {
  if (!blocked(from.z, to.z)) return [[to.x, from.z], [to.x, to.z]];
  const cost = (xe) => Math.abs(from.x - xe) + Math.abs(to.x - xe);
  const xe = cost(liftMin) <= cost(liftMax) ? liftMin : liftMax;
  return [[xe, from.z], [xe, to.z], [to.x, to.z]];
}

function planMove(kind, loc) {
  const s = slotByLoc.get(loc);
  if (!s) return null;
  const center = s.group.localToWorld(s.local.clone());
  const front = new THREE.Vector3(0, 0, 1).applyQuaternion(s.group.quaternion).setY(0).normalize();
  // 0.1m 덜 들어가 마스트가 선반 앞 빔에 박히지 않게 한다 (화물은 칸 안에 다 들어간다)
  const work = center.clone().addScaledVector(front, FORK_REACH + 0.1);
  const near = center.clone().addScaledVector(front, FORK_REACH + APPROACH);
  const up = Math.max(-0.2, s.local.y - PALLET_Y + 0.1); // 칸 바닥보다 살짝 높게 들고 들어간다
  const steps = [];
  for (const [x, z] of route(lift.position, near)) steps.push({ type: 'drive', x, z, speed: DRIVE });
  steps.push({ type: 'face', a: Math.atan2(-front.x, -front.z) });
  if (kind === 'out') steps.push({ type: 'act', fn: () => { lift.userData.palShow = 0; } });
  steps.push({ type: 'raise', h: up });
  steps.push({ type: 'drive', x: work.x, z: work.z, speed: CREEP });
  if (kind === 'in') {
    steps.push({ type: 'raise', h: up - 0.1 });
    steps.push({ type: 'act', fn: () => { lift.userData.palShow = 0; } });
  } else {
    steps.push({ type: 'act', fn: () => { lift.userData.palShow = 1; } });
    steps.push({ type: 'raise', h: up + 0.1 });
  }
  steps.push({ type: 'wait', t: 0.35 });
  steps.push({ type: 'drive', x: near.x, z: near.z, speed: CREEP, back: true });
  steps.push({ type: 'raise', h: 0 });
  return { loc, steps, i: 0 };
}

function planReturn() {
  const home = { x: THREE.MathUtils.clamp(lift.position.x, liftMin, liftMax), z: liftLane };
  const steps = route(lift.position, home).map(([x, z]) => ({ type: 'drive', x, z, speed: DRIVE }));
  // 순찰 중에는 늘 화물을 싣고 다닌다 (원래 모습)
  steps.push({ type: 'act', fn: () => { lift.userData.palShow = 1; } });
  return { loc: null, steps, i: 0 };
}

const turnToward = (a, dt) => {
  const d = wrapAngle(a - lift.rotation.y);
  const stepA = TURN * dt;
  lift.rotation.y = Math.abs(d) <= stepA ? a : lift.rotation.y + Math.sign(d) * stepA;
  return Math.abs(wrapAngle(a - lift.rotation.y));
};
const setRaise = (h) => {
  const { carriage, inner } = lift.userData;
  carriage.position.y = h;
  inner.position.y = Math.max(0, h) * 0.5;
};

// 한 단계를 진행하고, 끝났으면 true
function runStep(st, dt) {
  const p = lift.position;
  if (st.type === 'drive') {
    const dx = st.x - p.x, dz = st.z - p.z, dist = Math.hypot(dx, dz);
    if (dist < 0.02) { p.x = st.x; p.z = st.z; return true; }
    // 앞으로 갈 때는 가는 쪽을, 뒤로 뺄 때는 반대쪽을 바라본다. 방향을 다 잡은 뒤에 움직인다
    const heading = st.back ? Math.atan2(-dx, -dz) : Math.atan2(dx, dz);
    if (turnToward(heading, dt) > 0.12) return false;
    const k = Math.min(1, (st.speed * dt) / dist);
    p.x += dx * k; p.z += dz * k;
    return false;
  }
  if (st.type === 'face') return turnToward(st.a, dt) < 0.005;
  if (st.type === 'raise') {
    const y = lift.userData.carriage.position.y, d = st.h - y, stepH = LIFT_SPEED * dt;
    setRaise(Math.abs(d) <= stepH ? st.h : y + Math.sign(d) * stepH);
    return Math.abs(d) <= stepH;
  }
  if (st.type === 'act') { st.fn(); return true; }
  if (st.type === 'wait') { st.elapsed = (st.elapsed ?? 0) + dt; return st.elapsed >= st.t; }
  return true;
}

function updateLift(dt) {
  // 돌아가는 길에 새 일이 오면 그 자리에서 바로 간다
  if (job && job.loc === null && missions.length) job = null;
  if (!job && missions.length) {
    const next = missions.shift();
    job = planMove(next.kind, next.loc);
    workingLoc = job ? job.loc : null;
  }
  if (job) {
    while (job.i < job.steps.length && runStep(job.steps[job.i], dt)) { job.i += 1; dt = 0; }
    if (job.i >= job.steps.length) {
      const wasMove = job.loc !== null;
      job = null; workingLoc = null;
      // 다음 일이 없으면 통로로 돌아간다
      if (wasMove && !missions.length) job = planReturn();
    }
  } else {
    lift.position.x += liftDir * 2.4 * dt;
    if (lift.position.x > liftMax) liftDir = -1;
    if (lift.position.x < liftMin) liftDir = 1;
    lift.rotation.y = liftDir > 0 ? Math.PI / 2 : -Math.PI / 2;
  }
  // 화물은 튀어나오지 않고 0.3초 동안 커지고 줄어든다
  const { pal, palShow } = lift.userData;
  const sc = THREE.MathUtils.clamp(pal.scale.x + (palShow ? 1 : -1) * dt / 0.3, 0.001, 1);
  pal.scale.setScalar(sc);
  pal.visible = sc > 0.002;
}

/* ---------- 바깥 API ---------- */
const guard = (name, fn) => (...args) => { try { return fn(...args); } catch (err) { console.error(`[warehouse-3d] ${name} 실패`, err); } };

window.warehouse = {
  // day 는 받아도 쓰지 않는다 (화면은 오늘 값만 그린다)
  setData: guard('setData', ({ layout, projection } = {}) => {
    if (!layout) return;
    const stock = indexStock(layout, projection);
    const k = JSON.stringify([layout.racks, layout.zones, [...stock]]);
    if (k === data.key) return;
    data.layout = layout; data.stock = stock; data.key = k;
    buildWorld(layout);
    ui.highlight = new Set([...ui.highlight].filter((l) => slotByLoc.has(l)));
    if (ui.loc && !slotByLoc.has(ui.loc)) ui.loc = null;
    if (!introDone) { introDone = true; goHome(2600); }
  }),
  select: guard('select', (loc) => {
    const next = loc && slotByLoc.has(loc) ? loc : null;
    if (next !== ui.loc) { ui.loc = next; ui.selAt = performance.now(); }
  }),
  highlight: guard('highlight', (locs) => { ui.highlight = new Set((Array.isArray(locs) ? locs : []).filter((l) => slotByLoc.has(l))); }),
  flyTo: guard('flyTo', (target) => {
    if (!data.layout) return;
    if (target === 'home') return goHome();
    if (target === 'top') return ui.topView ? goHome() : goTop();
    if (target && Array.isArray(target.locs)) return target.locs.length === 1 ? flyToSlot(target.locs[0]) : flyToLocs(target.locs);
  }),
  // 지게차 입출고 동작. 그 부품이 놓인 칸이 없거나 움직임 줄이기 설정이면 하지 않는다. 밀린 일은 최근 MAX_QUEUE 건만 남긴다
  moveStock: guard('moveStock', ({ partId, kind } = {}) => {
    if (reduced || !lift || (kind !== 'in' && kind !== 'out')) return;
    const p = data.layout?.placements.find((q) => q.part_id === partId);
    const loc = p && `${p.rack_id}-${p.level}-${p.slot}`;
    if (!loc || !slotByLoc.has(loc)) return;
    missions.push({ kind, loc });
    if (missions.length > MAX_QUEUE) missions.shift();
  }),
};

/* ---------- 루프 ---------- */
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fly) {
    const k = Math.min(1, (now - fly.start) / fly.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k === 1) { fly = null; if (idleHome && !reduced && !ui.topView) controls.autoRotate = true; }
  }
  controls.update();
  if (lift && !reduced) updateLift(dt);
  const pulse = reduced ? 0.5 : 0.5 + 0.5 * Math.sin(now / 200);
  for (const [loc, s] of slotByLoc) {
    /* 선택 표시는 클릭 직후 1.2초 동안만 보였다가 사라짐 */
    const selFade = loc === ui.loc ? Math.max(0, 1 - (now - ui.selAt) / 1200) : 0;
    const hl = ui.highlight.has(loc);
    const working = loc === workingLoc;
    s.mat.opacity = selFade > 0 ? 0.35 * selFade : hl || working ? 0.12 + 0.18 * pulse : loc === ui.hover ? 0.05 : 0;
    if (selFade > 0 || hl || s.beam) { const b = beamFor(loc); b.visible = selFade > 0 || hl; b.material.opacity = hl ? 0.08 + 0.1 * pulse : 0.16 * selFade; }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
window.__whReady = true;
post('ready');
</script>
</body>
</html>
