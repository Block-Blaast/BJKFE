<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블록블라스트 3D 창고</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 화면 전체가 3D 창고 시뮬레이션. 위에 작은 컨트롤, 칸을 누르면 정보 카드. 프로젝트 톤에 맞춘 연한 하늘색 단일 테마 */
:root {
  color-scheme: light;
  --sky: #eef5fb;
  --ink: #23384a;
  --muted: #6a8195;
  --line: #d3e2ee;
  --card: rgba(255, 255, 255, 0.86);
  --accent: #4a9fe0;
  --ok: #6cc79a;
  --low: #ef8e7d;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; margin: 0; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.glass { background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 20px rgba(60, 110, 150, 0.12); }
.top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; pointer-events: none; }
.top > * { pointer-events: auto; }
.brand { padding: 9px 14px; display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font-size: 15px; font-weight: 600; }
.brand span { font-size: 12px; color: var(--muted); }
.btns { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 13px; cursor: pointer; font-size: 13px; }
.btn:hover, .btn[aria-pressed="true"] { border-color: var(--accent); color: #2f7fc0; }
.legend { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); max-width: min(560px, calc(100% - 32px)); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.info { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(280px, calc(100% - 32px)); padding: 14px 16px; display: grid; gap: 8px; }
.info .eyebrow { font-size: 11px; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.info h2 { margin: 0; font-family: var(--font-mono); font-size: 20px; font-weight: 600; }
.info .row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; background: rgba(238, 245, 251, 0.9); border-radius: 8px; }
.info .row b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.info .empty { color: var(--muted); font-size: 13px; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #fde4df; color: #b5503f; margin-left: 4px; }
.hint { font-size: 12px; color: var(--muted); }
@media (max-width: 640px) {
  .brand span { display: none; }
  .info { bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); }
}
</style>
</head>
<body>
<div id="stage" role="img" aria-label="3D 창고 시뮬레이션"></div>

<div class="top">
  <div class="brand glass"><h1>블록블라스트 3D 창고</h1><span>시뮬레이션 예시</span></div>
  <div class="btns">
    <button class="btn glass" id="btnFind" type="button">숨은 재고 찾기 예시</button>
    <button class="btn glass" id="btnAll" type="button">전체 보기</button>
    <button class="btn glass" id="btnTop" type="button" aria-pressed="false">탑뷰</button>
  </div>
</div>

<div class="legend glass" aria-label="범례">
  <span><i style="background:var(--ok)"></i>정상</span>
  <span><i style="background:var(--low)"></i>품목 부족</span>
  <span><i style="background:#d3dde6"></i>빈 칸</span>
  <span><i style="background:var(--accent)"></i>선택·강조</span>
  <span><i style="background:#a9c8ee"></i>베어링</span>
  <span><i style="background:#f3e0a8"></i>체결류</span>
  <span><i style="background:#f1c0b6"></i>기계 부품</span>
  <span><i style="background:#bfe2cc"></i>전기</span>
  <span><i style="background:#d4dbe1"></i>원자재</span>
  <span><i style="background:#e6d3bd"></i>완제품</span>
</div>

<div class="info glass" id="info" aria-live="polite">
  <div class="eyebrow">칸 정보</div>
  <p class="hint" style="margin:0">드래그로 회전, 휠로 확대하고 선반 칸을 눌러 보세요.</p>
</div>

<script>
  setTimeout(function () {
    if (window.__whReady) return;
    var info = document.getElementById('info');
    if (info) info.innerHTML = '<div class="eyebrow">불러오기 실패</div><p class="hint" style="margin:0">3D 화면을 그리는 데 필요한 파일을 받지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>';
  }, 10000);
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- 예시 데이터 ---------- */
const ZONES = [
  { id: 'A', name: '원자재', x0: -22, x1: -6 },
  { id: 'B', name: '부품', x0: -5, x1: 15 },
  { id: 'C', name: '완제품', x0: 16, x1: 29 },
];
const SHELVES = [
  { code: 'A-01', x: -14, z: -6, levels: 4, slots: 4 },
  { code: 'A-02', x: -14, z: 1, levels: 4, slots: 4 },
  { code: 'B-01', x: 0, z: -6, levels: 4, slots: 4 },
  { code: 'B-02', x: 0, z: 1, levels: 4, slots: 4 },
  { code: 'B-03', x: 10, z: -6, levels: 4, slots: 4 },
  { code: 'B-04', x: 10, z: 1, levels: 4, slots: 4 },
  { code: 'C-01', x: 22.5, z: -6, levels: 3, slots: 4 },
  { code: 'C-02', x: 22.5, z: 1, levels: 3, slots: 4 },
];
const CAT = { bearing: '#a9c8ee', fastener: '#f3e0a8', mech: '#f1c0b6', elec: '#bfe2cc', raw: '#d4dbe1', product: '#e6d3bd' };
const ITEMS = [
  ['b6205', '6205 베어링', 'bearing', '개', 20], ['b6305', '6305 베어링', 'bearing', '개', 10],
  ['m8', 'M8 볼트', 'fastener', '개', 200], ['m6', 'M6 볼트', 'fastener', '개', 200], ['n8', 'M8 너트', 'fastener', '개', 200], ['w8', 'M8 와셔', 'fastener', '개', 200],
  ['belt', '모터 벨트 A-42', 'mech', '개', 4], ['coup', '커플링 19-19', 'mech', '개', 4], ['oring', 'O링 P20', 'mech', '개', 50],
  ['hose', '유압 호스 1/2', 'mech', '개', 6], ['grease', '그리스 카트리지', 'mech', '개', 6], ['tape', '테프론 테이프', 'mech', '개', 20],
  ['relay', '릴레이 24V', 'elec', '개', 10], ['fuse', '퓨즈 10A', 'elec', '개', 30], ['cable', '전선 2.5SQ', 'elec', '롤', 2],
  ['sheet', 'SUS 판재 2T', 'raw', '장', 5], ['pipe', '각파이프 30×30', 'raw', '개', 10], ['paint', '방청 도료', 'raw', '통', 3],
  ['pump', '펌프 하우징 PH-200', 'product', '개', 3], ['imp', '임펠러 PH-200', 'product', '개', 3], ['box', '포장 박스 대', 'product', '개', 30],
].map(([id, name, cat, unit, min]) => ({ id, name, color: CAT[cat], unit, min }));
const STOCK = [
  ['A-01-1-1', 'sheet', 8], ['A-01-1-2', 'sheet', 4], ['A-01-1-3', 'pipe', 14], ['A-01-2-1', 'paint', 2],
  ['A-01-2-2', 'grease', 9], ['A-01-3-1', 'cable', 1], ['A-01-4-1', 'pipe', 8],
  ['A-02-1-1', 'b6205', 30], ['A-02-2-1', 'grease', 6], ['A-02-2-3', 'tape', 25], ['A-02-3-4', 'm8', 120], ['A-02-4-2', 'sheet', 6],
  ['B-01-1-1', 'oring', 60], ['B-01-1-2', 'coup', 3], ['B-01-2-3', 'b6205', 12], ['B-01-2-4', 'b6305', 8],
  ['B-01-3-1', 'oring', 40], ['B-01-4-4', 'tape', 30],
  ['B-02-1-1', 'm8', 180], ['B-02-1-2', 'm6', 260], ['B-02-1-3', 'n8', 300], ['B-02-1-4', 'w8', 220],
  ['B-02-2-2', 'm6', 120], ['B-02-3-3', 'n8', 200], ['B-02-4-1', 'w8', 150],
  ['B-03-1-1', 'hose', 7], ['B-03-2-1', 'relay', 12], ['B-03-2-2', 'fuse', 40], ['B-03-3-1', 'belt', 2],
  ['B-03-3-3', 'fuse', 25], ['B-03-4-2', 'relay', 8],
  ['B-04-1-1', 'imp', 2], ['B-04-1-2', 'pump', 4], ['B-04-2-2', 'hose', 3], ['B-04-3-1', 'pump', 3],
  ['C-01-1-1', 'box', 40], ['C-01-1-2', 'box', 15], ['C-01-2-1', 'box', 30], ['C-01-3-3', 'box', 20],
  ['C-02-1-1', 'pump', 5], ['C-02-2-2', 'box', 25],
].map(([loc, itemId, qty]) => ({ loc, itemId, qty }));

const itemById = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const ALL_LOCS = SHELVES.flatMap(s => { const o = []; for (let l = 1; l <= s.levels; l++) for (let i = 1; i <= s.slots; i++) o.push(`${s.code}-${l}-${i}`); return o; });
const totalOf = id => STOCK.filter(s => s.itemId === id).reduce((a, s) => a + s.qty, 0);
const itemsAt = loc => STOCK.filter(s => s.loc === loc && s.qty > 0);
const isLow = id => totalOf(id) < itemById[id].min;
const slotStatus = loc => { const its = itemsAt(loc); if (!its.length) return 'empty'; return its.some(s => isLow(s.itemId)) ? 'low' : 'ok'; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ui = { loc: null, hover: null, highlight: new Set(), topView: false };

/* ---------- 장면 ---------- */
const SKY = 0xeef5fb;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 60, 120);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.08;
controls.minDistance = 3;
controls.maxDistance = 95;
controls.autoRotateSpeed = 0.35;
const CENTER = new THREE.Vector3(4, 1.5, -2.5);
const HOME = { pos: new THREE.Vector3(-17, 19, 25), target: CENTER.clone() };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
camera.position.set(46, 50, 62);
controls.target.copy(CENTER);

scene.add(new THREE.HemisphereLight(0xffffff, 0xcfdfec, 2.2));
const key = new THREE.DirectionalLight(0xffffff, 1.3);
key.position.set(-18, 34, 22);
key.target.position.copy(CENTER);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -38, right: 38, top: 26, bottom: -26, near: 1, far: 120 });
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key, key.target);

/* 바닥 */
const FLOOR = { x0: -26, x1: 32, z0: -14, z1: 12 };
function tileTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#f6f9fc'; g.fillRect(0, 0, 256, 256);
  g.strokeStyle = '#dde8f1'; g.lineWidth = 2; g.strokeRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(29, 13); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR.x1 - FLOOR.x0, FLOOR.z1 - FLOOR.z0), new THREE.MeshStandardMaterial({ map: tileTexture(), roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.position.set((FLOOR.x0 + FLOOR.x1) / 2, 0, (FLOOR.z0 + FLOOR.z1) / 2);
floor.receiveShadow = true;
scene.add(floor);
const lineMat = new THREE.MeshBasicMaterial({ color: 0x9fcbec });
const strip = (x0, x1, z, w = 0.14) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, w), lineMat); m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, 0.012, z); scene.add(m); };
const stripZ = (x, z0, z1, w = 0.14) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, z1 - z0), lineMat); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, (z0 + z1) / 2); scene.add(m); };
[-7.4, -4.6, -0.4, 2.4].forEach(z => strip(FLOOR.x0 + 1, FLOOR.x1 - 1, z));
ZONES.forEach(z => { stripZ(z.x0, -12, 10); stripZ(z.x1, -12, 10); });

function textTexture(text, { fg = '#23384a', bg = 'rgba(255,255,255,0.95)', size = 64, pad = 22, weight = '600', radius = 14 } = {}) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  const f = `${weight} ${size}px "IBM Plex Sans KR", "Apple SD Gothic Neo", sans-serif`;
  ctx.font = f;
  const w = Math.ceil(ctx.measureText(text).width) + pad * 2, h = Math.ceil(size + pad * 1.4);
  c.width = w; c.height = h; ctx.font = f;
  if (bg) { ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, w, h, radius); ctx.fill(); }
  ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(text, pad, h / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  return { tex, aspect: w / h };
}
ZONES.forEach(z => {
  const { tex, aspect } = textTexture(`${z.id}  ${z.name}`, { bg: null, fg: 'rgba(110,170,220,0.75)', size: 120 });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.2 * aspect, 2.2), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set((z.x0 + z.x1) / 2, 0.02, 6.6); scene.add(m);
});
const pillarMat = new THREE.MeshStandardMaterial({ color: 0xe2eaf1, roughness: 0.9 });
[[-24, -12], [4.5, -12], [30, -12]].forEach(([x, z]) => {
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, 11, 0.8), pillarMat);
  p.position.set(x, 5.5, z); p.castShadow = true; p.receiveShadow = true; scene.add(p);
});

/* 랙 */
const SLOT_W = 1.8, LEVEL_H = 1.5, DEPTH = 1.25, BASE = 0.3;
const uprightMat = new THREE.MeshStandardMaterial({ color: 0x86b9e3, roughness: 0.55, metalness: 0.1 });
const beamMat = new THREE.MeshStandardMaterial({ color: 0xbcdaf2, roughness: 0.55, metalness: 0.1 });
const deckMat = new THREE.MeshStandardMaterial({ color: 0xe6edf3, roughness: 0.7 });
const LED = { ok: new THREE.MeshBasicMaterial({ color: 0x6cc79a }), low: new THREE.MeshBasicMaterial({ color: 0xef8e7d }), empty: new THREE.MeshBasicMaterial({ color: 0xd3dde6 }) };
const GLOW = new THREE.Color(0x4a9fe0);
const slotByLoc = new Map();
const hitMeshes = [];
const ledGeo = new THREE.BoxGeometry(0.34, 0.08, 0.04);

for (const s of SHELVES) {
  const g = new THREE.Group(); g.position.set(s.x, 0, s.z); scene.add(g);
  const W = s.slots * SLOT_W, H = BASE + s.levels * LEVEL_H;
  const add = (geo, mat, x, y, z, shadow = true) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (shadow) { m.castShadow = true; m.receiveShadow = true; } g.add(m); return m; };
  const upGeo = new THREE.BoxGeometry(0.12, H + 0.25, 0.12);
  for (const x of [-W / 2, 0, W / 2]) {
    for (const z of [-DEPTH / 2, DEPTH / 2]) add(upGeo, uprightMat, x, (H + 0.25) / 2, z);
    for (let k = 0; k < Math.floor(H / 1.1); k++) { const br = add(new THREE.BoxGeometry(0.05, 1.45, 0.05), uprightMat, x, 0.6 + k * 1.1, 0, false); br.rotation.x = (k % 2 ? 1 : -1) * 0.95; }
  }
  for (let l = 0; l < s.levels; l++) {
    const y = BASE + l * LEVEL_H;
    for (const z of [-DEPTH / 2, DEPTH / 2]) add(new THREE.BoxGeometry(W, 0.16, 0.09), beamMat, 0, y - 0.04, z);
    add(new THREE.BoxGeometry(W - 0.04, 0.035, DEPTH), deckMat, 0, y + 0.05, 0);
  }
  for (const z of [-DEPTH / 2, DEPTH / 2]) add(new THREE.BoxGeometry(W, 0.16, 0.09), beamMat, 0, H, z);
  const { tex, aspect } = textTexture(s.code, { fg: '#3a86c4', size: 96, pad: 30, radius: 18 });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.0 * aspect, 1.0), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
  sign.position.set(0, H + 1.0, DEPTH / 2 + 0.02); g.add(sign);
  const back = sign.clone(); back.rotation.y = Math.PI; back.position.z = -DEPTH / 2 - 0.02; g.add(back);
  for (const sx of [-0.36 * aspect, 0.36 * aspect]) add(new THREE.BoxGeometry(0.03, 0.5, 0.03), uprightMat, sx, H + 0.3, DEPTH / 2, false);

  for (let l = 1; l <= s.levels; l++) for (let i = 1; i <= s.slots; i++) {
    const loc = `${s.code}-${l}-${i}`;
    const lx = -W / 2 + SLOT_W * (i - 0.5);
    const base = BASE + (l - 1) * LEVEL_H + 0.07;
    const mat = new THREE.MeshBasicMaterial({ color: GLOW, transparent: true, opacity: 0, depthWrite: false });
    const hit = new THREE.Mesh(new THREE.BoxGeometry(SLOT_W * 0.96, LEVEL_H * 0.86, DEPTH * 1.02), mat);
    hit.position.set(lx, base + LEVEL_H * 0.43, 0); hit.userData.loc = loc; g.add(hit); hitMeshes.push(hit);
    const led = new THREE.Mesh(ledGeo, LED[slotStatus(loc)]);
    led.position.set(lx, base - 0.13, DEPTH / 2 + 0.07); g.add(led);
    slotByLoc.set(loc, { group: g, hit, mat, local: new THREE.Vector3(lx, base, 0), beam: null });
  }
}

/* 상자 */
const edgeMat = new THREE.LineBasicMaterial({ color: 0x8aa6bd, transparent: true, opacity: 0.45 });
const crateMats = new Map();
const crateMat = hex => { if (!crateMats.has(hex)) crateMats.set(hex, new THREE.MeshStandardMaterial({ color: hex, roughness: 0.75 })); return crateMats.get(hex); };
for (const loc of ALL_LOCS) {
  const slot = slotByLoc.get(loc);
  const its = itemsAt(loc).slice(0, 3);
  const colW = (SLOT_W * 0.88) / Math.max(1, its.length);
  its.forEach((s, k) => {
    const n = Math.max(1, Math.min(3, 1 + Math.floor(Math.log10(s.qty + 1) * 1.1)));
    for (let j = 0; j < n; j++) {
      const geo = new THREE.BoxGeometry(colW * 0.9, 0.36, DEPTH * 0.82);
      const box = new THREE.Mesh(geo, crateMat(itemById[s.itemId].color));
      box.castShadow = true; box.receiveShadow = true;
      const p = slot.local.clone();
      p.x += -SLOT_W * 0.44 + colW * (k + 0.5) + (j % 2 ? 0.03 : -0.03);
      p.y += 0.38 * (j + 0.5);
      slot.group.localToWorld(p);
      box.position.copy(p);
      box.rotation.y = (j % 2 ? 1 : -1) * 0.04;
      box.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat));
      scene.add(box);
    }
  });
}

/* 강조 빛기둥 */
const beamGeo = new THREE.CylinderGeometry(0.55, 0.85, 1, 32, 1, true); beamGeo.translate(0, 0.5, 0);
function beamFor(loc) {
  const s = slotByLoc.get(loc);
  if (s.beam) return s.beam;
  const m = new THREE.Mesh(beamGeo, new THREE.MeshBasicMaterial({ color: GLOW, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
  const p = s.local.clone(); s.group.localToWorld(p);
  m.position.copy(p); m.scale.set(1, 12 - p.y, 1); m.visible = false; scene.add(m);
  s.beam = m; return m;
}

/* 지게차 */
function forklift() {
  const f = new THREE.Group();
  const body = new THREE.MeshStandardMaterial({ color: 0xf3e0a8, roughness: 0.6 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x8d9fae, roughness: 0.7 });
  const steel = new THREE.MeshStandardMaterial({ color: 0xc8d4de, roughness: 0.5, metalness: 0.3 });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; f.add(m); return m; };
  add(new THREE.BoxGeometry(1.3, 0.7, 2.0), body, 0, 0.65, 0);
  add(new THREE.BoxGeometry(1.3, 0.5, 0.5), dark, 0, 0.75, -0.95);
  add(new THREE.BoxGeometry(0.7, 0.4, 0.6), dark, 0, 1.2, -0.2);
  for (const x of [-0.6, 0.6]) for (const z of [-0.6, 0.6]) add(new THREE.BoxGeometry(0.06, 1.3, 0.06), dark, x, 1.65, z - 0.1);
  add(new THREE.BoxGeometry(1.3, 0.06, 1.3), dark, 0, 2.3, -0.1);
  for (const x of [-0.45, 0.45]) add(new THREE.BoxGeometry(0.1, 2.8, 0.1), steel, x, 1.45, 1.1);
  for (const x of [-0.3, 0.3]) add(new THREE.BoxGeometry(0.12, 0.05, 1.2), steel, x, 0.32, 1.75);
  const wheel = new THREE.CylinderGeometry(0.32, 0.32, 0.25, 20); wheel.rotateZ(Math.PI / 2);
  for (const x of [-0.68, 0.68]) for (const z of [-0.6, 0.65]) add(wheel, dark, x, 0.32, z);
  add(new THREE.BoxGeometry(1.1, 0.14, 1.1), new THREE.MeshStandardMaterial({ color: 0xdcc9ad, roughness: 0.9 }), 0, 0.42, 1.75);
  add(new THREE.BoxGeometry(0.95, 0.6, 0.95), crateMat(CAT.product), 0, 0.79, 1.75);
  return f;
}
const lift = forklift();
lift.position.set(-18, 0, -2.5);
scene.add(lift);
let liftDir = 1;

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* 카메라 */
let fly = null, idleHome = true;
function flyTo(pos, target, dur = 950) {
  controls.autoRotate = false;
  if (reduced) { camera.position.copy(pos); controls.target.copy(target); return; }
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(), start: performance.now(), dur };
}
function setTop(on) { ui.topView = on; document.getElementById('btnTop').setAttribute('aria-pressed', String(on)); }
function goHome() { idleHome = true; setTop(false); flyTo(HOME.pos, HOME.target, 1100); }
const slotWorld = loc => { const s = slotByLoc.get(loc); const p = s.local.clone(); p.y += LEVEL_H * 0.4; return s.group.localToWorld(p); };
function flyToSlot(loc) { idleHome = false; setTop(false); const t = slotWorld(loc); flyTo(t.clone().add(new THREE.Vector3(1.6, 1.6, 6.4)), t); }
function flyToLocs(locs) {
  idleHome = false; setTop(false);
  const pts = locs.map(slotWorld);
  const c = pts.reduce((a, p) => a.add(p), new THREE.Vector3()).multiplyScalar(1 / pts.length);
  const span = Math.max(...pts.map(p => p.distanceTo(c)));
  flyTo(c.clone().add(new THREE.Vector3(-2, 7 + span * 0.7, 10 + span * 1.1)), c);
}

/* 정보 카드 */
const info = document.getElementById('info');
const INFO_HOME = '<div class="eyebrow">칸 정보</div><p class="hint" style="margin:0">드래그로 회전, 휠로 확대하고 선반 칸을 눌러 보세요.</p>';
function showInfo(loc) {
  const its = itemsAt(loc);
  info.innerHTML = `<div class="eyebrow">선택한 칸</div><h2>${loc}</h2>` + (its.length
    ? its.map(s => { const it = itemById[s.itemId]; return `<div class="row"><span>${esc(it.name)}${isLow(it.id) ? '<span class="pill">부족</span>' : ''}</span><b>${s.qty}${esc(it.unit)}</b></div>`; }).join('')
    : '<p class="empty" style="margin:0">비어 있는 칸이에요.</p>');
}
function selectSlot(loc) { ui.loc = loc; ui.highlight = new Set(); showInfo(loc); flyToSlot(loc); }

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(hitMeshes, false)[0];
  return hit ? hit.object.userData.loc : null;
}
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; fly = null; controls.autoRotate = false; idleHome = false; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 6) return;
  const loc = pick(e); if (loc) selectSlot(loc);
});
renderer.domElement.addEventListener('pointermove', e => { if (down) return; ui.hover = pick(e); renderer.domElement.style.cursor = ui.hover ? 'pointer' : 'grab'; });

document.getElementById('btnAll').addEventListener('click', () => { ui.loc = null; ui.highlight = new Set(); info.innerHTML = INFO_HOME; goHome(); });
document.getElementById('btnTop').addEventListener('click', () => {
  if (ui.topView) return goHome();
  idleHome = false; setTop(true);
  flyTo(new THREE.Vector3(CENTER.x, 58, CENTER.z + 0.01), new THREE.Vector3(CENTER.x, 0, CENTER.z));
});
document.getElementById('btnFind').addEventListener('click', () => {
  const rows = STOCK.filter(s => s.itemId === 'b6205');
  ui.loc = null; ui.highlight = new Set(rows.map(s => s.loc));
  info.innerHTML = `<div class="eyebrow">숨은 재고 찾기</div><h2 style="font-family:var(--font-body)">6205 베어링</h2>
    <p class="hint" style="margin:0">"베어링 작은 거"로 등록된 재고까지 찾아 ${rows.length}곳을 표시했어요.</p>` +
    rows.map(s => `<div class="row"><span style="font-family:var(--font-mono)">${s.loc}</span><b>${s.qty}개</b></div>`).join('');
  flyToLocs(rows.map(s => s.loc));
});

/* 루프 */
let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fly) {
    const k = Math.min(1, (now - fly.start) / fly.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (k === 1) { fly = null; if (idleHome && !reduced && !ui.topView) controls.autoRotate = true; }
  }
  controls.update();
  if (!reduced) {
    lift.position.x += liftDir * 2.4 * dt;
    if (lift.position.x > 27) liftDir = -1;
    if (lift.position.x < -19) liftDir = 1;
    lift.rotation.y = liftDir > 0 ? Math.PI / 2 : -Math.PI / 2;
  }
  const pulse = reduced ? 0.5 : 0.5 + 0.5 * Math.sin(now / 200);
  for (const [loc, s] of slotByLoc) {
    const sel = loc === ui.loc, hl = ui.highlight.has(loc);
    s.mat.opacity = sel ? 0.28 + 0.12 * pulse : hl ? 0.14 + 0.2 * pulse : loc === ui.hover ? 0.14 : 0;
    if (sel || hl || s.beam) { const b = beamFor(loc); b.visible = sel || hl; b.material.opacity = 0.08 + 0.1 * pulse; }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
flyTo(HOME.pos, HOME.target, 2600);
window.__whReady = true;
</script>
