name: Deploy

# main에 머지되면 web 이미지를 GHCR에 올리고 대회 서버(BJK-Cloud deploy/)에 배포
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 세 레포 배포가 겹치지 않게 레포별로 순서대로
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/block-blaast/bjk-web
  DEPLOY_HOST: 16.208.85.207
  # 서버 호스트 키 (ssh-keyscan 결과를 서버의 /etc/ssh/ssh_host_ed25519_key.pub과 대조함)
  KNOWN_HOST: 16.208.85.207 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHAPwFaLS0ZjdBmX5nBvcHWzFlHU1R20OKZ+c75ch53r

jobs:
  deploy:
    name: Deploy / web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 서버 배포
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOST" > ~/.ssh/known_hosts
          # 토큰은 명령줄 대신 표준입력으로 넘긴다
          printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "ubuntu@$DEPLOY_HOST" \
            "read -r GHCR_TOKEN && GHCR_TOKEN=\$GHCR_TOKEN GHCR_USER=${{ github.actor }} WEB_TAG=${{ github.sha }} /opt/bjk/scripts/deploy.sh web"
