name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check:
    name: CI / lint·type·build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # 각 패키지 typecheck가 next typegen을 먼저 실행 (turbo)
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: /api

  image:
    name: CI / image build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bjk-web:ci
          cache-from: type=gha,scope=web
          # 시연 서버처럼 MSW 목업을 켠 이미지를 확인하려면 저장소 변수 USE_MOCKS 를 1 로 둔다
          # (Settings → Secrets and variables → Actions → Variables). 비어 있으면 꺼진 채로 빌드한다.
          build-args: |
            NEXT_PUBLIC_USE_MOCKS=${{ vars.USE_MOCKS }}
      # 배포 이미지가 실제로 뜨고 응답하는지 확인
      - name: 컨테이너 기동 확인
        run: |
          docker run -d --name web -p 3000:3000 bjk-web:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || true)
            if [ "$code" != 000 ] && [ "$code" -lt 500 ]; then echo "HTTP $code"; exit 0; fi
            sleep 2
          done
          docker logs web
          exit 1
