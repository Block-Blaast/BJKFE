# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# CodeRabbit 설정 — BJKFE 발주콕 프론트엔드 (pnpm + Turborepo 모노레포)
# 프로젝트 규약은 AGENTS.md 와 .claude/rules/ 를 따릅니다. 아래 path_instructions 는 그 규약을 리뷰에 반영하기 위한 요약입니다.

language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_filters:
    - '!**/node_modules/**'
    - '!**/.next/**'
    - '!**/.turbo/**'
    - '!apps/*/public/**'
    - '!pnpm-lock.yaml'
    - '!**/next-env.d.ts'

  path_instructions:
    - path: '**/*.{ts,tsx}'
      instructions: |
        - 컴포넌트는 화살표 함수(`const Name = () => {}`)로 선언하고 파일 끝에서 `export default Name` 한다.
        - props 타입은 `<컴포넌트명>Props` 이름의 `type` 으로 선언한다. `any` 지양.
        - useMemo/useCallback/React.memo 를 근거 없이 남발하지 않는다.
        - 기존 "왜" 주석을 근거 없이 지우지 않는다.
    - path: 'apps/**/*.{ts,tsx}'
      instructions: |
        - 판정·체크 코드(C-01~09)·상태 문자열을 직접 쓰지 않고 @bjk/api/domain/* 상수를 쓴다.
        - 레이아웃에서 usePathname·params 같은 요청 시점 값을 Suspense 밖에서 읽지 않는다(cacheComponents).
        - 내부 패키지는 `@bjk/*` 이름으로 import 한다. `../../packages/` 상대 경로 금지.
        - 기본은 서버 컴포넌트다. 'use client' 는 상태·이벤트·브라우저 API·Query/Zustand 가 필요한
          작은 컴포넌트에만 붙인다. 페이지 전체를 클라이언트로 만드는 변경을 지적한다.
        - page.tsx 의 params/searchParams 는 Promise 이므로 await 해서 쓴다.
        - 앱에서 fetch 를 직접 호출하지 않고 @bjk/api 를 거친다.
        - 서버 데이터를 Zustand 스토어에 복사하지 않는다(Query 캐시가 유일한 출처).
        - 토스트 등 사용자 피드백은 훅의 onError 가 아니라 화면에서 처리한다.
    - path: 'apps/*/src/**/*.tsx'
      instructions: |
        - 시맨틱 토큰(bg-bg-*, text-text-*, border-border-*, text-icon-*)만 쓴다. 프리미티브(bg-brand-600)는 일러스트·장식만.
        - hex·임의값 클래스 금지, 모서리는 rounded-md(입력)·rounded-xl(카드)·rounded-full(알약)만, 간격은 1/2/3/4/5/6/8/12 단계만 (pnpm lint:design 이 검사).
        - brand-500 위 흰 글씨, gray-400 이하 본문 글씨, 상태색 500 글씨를 지적한다.
        - 상태 표시는 색 + 아이콘 + 라벨을 함께 쓰는지(StatusChip) 본다. 수량·표 숫자는 tabular-nums.
        - Button·StatusChip·Input·Card 를 앱에서 다시 만들지 않고 @bjk/ui 를 쓰는지 본다. 다크 모드 코드 금지.
        - 동적으로 조각낸 클래스명(`bg-${color}-500`)은 Tailwind 가 감지하지 못한다.
        - 이미지는 next/image, 내부 링크는 next/link 를 쓴다.
    - path: 'apps/web/src/app/m/**/*.tsx'
      instructions: |
        - 모바일 우선. 기본 클래스가 모바일이고 sm:/md: 로 넓은 화면을 덮어쓴다.
        - hover 에만 의존하는 UI, 44px 미만 터치 대상, h-screen(→ h-dvh) 사용을 지적한다.
    - path: 'apps/web/src/app/(desk)/**/*.tsx'
      instructions: |
        - 데스크톱 전용. 모바일 대응 코드는 필요 없다.
        - 목록의 필터·정렬·페이지 상태는 URL 쿼리스트링에 둔다(Zustand 금지).
        - 삭제 등 되돌릴 수 없는 작업에 확인 단계가 있는지 본다.
    - path: 'packages/api/**/*.ts'
      instructions: |
        - React 컴포넌트·useQuery 호출을 두지 않는다. 호출 함수, 타입, queryKeys, queryOptions 만 둔다.
        - 쿼리 키는 queryKeys 팩토리만 쓴다. 문자열 배열 직접 사용 금지.
        - 서버가 주지 않는 값을 반환 타입에 적지 않는다.
        - 새 파일은 package.json 의 exports 에 등록됐는지 확인한다.
        - 이 패키지의 변경은 user·admin 두 앱 모두에 영향을 준다.
    - path: 'packages/ui/src/tokens.css'
      instructions: |
        - Figma(sJfs73BOfgYtBrAB3Xx8si)와 대조된 값이다. 값이 바뀌면 scripts/verify-tokens.mjs 의 기대값도 함께 바뀌었는지 확인한다.
    - path: '**/package.json'
      instructions: |
        - 패키지 매니저는 pnpm 만 사용한다. 루트 `packageManager` 필드를 유지한다.
        - 런타임 의존성은 그것을 쓰는 앱/패키지에 두고, 루트에는 개발 도구만 둔다.

  tools:
    eslint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: '.claude/rules/structure.md'
        applyTo: '**'
      - files: '.claude/rules/code-style.md'
        applyTo: 'apps/*/src/**, packages/*/src/**'
      - files: '.claude/rules/api.md'
        applyTo: 'packages/api/**, apps/*/src/hooks/**, apps/*/src/app/**'
      - files: '.claude/rules/design-system.md'
        applyTo: 'apps/*/src/**, packages/ui/**'
      - files: '.claude/rules/mobile.md'
        applyTo: 'apps/web/src/app/m/**, apps/web/src/components/mobile/**'
      - files: '.claude/rules/desk.md'
        applyTo: 'apps/web/src/app/(desk)/**, apps/web/src/components/desk/**'
  learnings:
    scope: auto
  issues:
    scope: auto
